<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydrology and Drainage Toolkit</title>
<style>
:root{--bg:#f4f6f6;--card:#fff;--tx:#1b1f20;--mut:#62706f;--bd:#d7dfde;--ac:#0f6b7a;--ok:#1f7a4d;--bad:#b3261e;--c1:#1f6fb0;--c2:#b8470f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121616;--card:#1b2122;--tx:#eaf0ef;--mut:#9aa9a7;--bd:#323c3d;--ac:#5cc3d3;--ok:#5fd39a;--bad:#ff8a80;--c1:#6fb2e8;--c2:#f0894f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121616;--card:#1b2122;--tx:#eaf0ef;--mut:#9aa9a7;--bd:#323c3d;--ac:#5cc3d3;--ok:#5fd39a;--bad:#ff8a80;--c1:#6fb2e8;--c2:#f0894f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:700px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
p.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){.tabs button.on{color:#06201f}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;padding:8px 12px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.r b{display:block;font-size:17px}.r span{font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.sc td input{width:80px;padding:6px}.sc td input.w{width:110px}
tr.hl td{background:color-mix(in srgb,var(--ok) 14%,transparent)}
svg{width:100%;height:auto;display:block}
.note{font-size:12px;color:var(--mut);margin-top:6px}.mt{margin-top:10px}
</style>
<link rel="stylesheet" href="structaviz-tools.css">
<script src="structaviz-tools.js"></script>
</head>
<body>
<main>
<h1>Hydrology and Drainage Toolkit</h1>
<p class="sub">SI units: m, m³/s, mm/h, ha. Check results against your local design manual.</p>
<div class="tabs" id="tabs"><button data-t="hro" class="on">Runoff</button><button data-t="hpi">Pipe</button><button data-t="hch">Channel</button><button data-t="hcu">Culvert</button></div>
<section id="hro"></section><section id="hpi" hidden></section><section id="hch" hidden></section><section id="hcu" hidden></section>
</main>
<script>
const $=id=>document.getElementById(id),g=id=>parseFloat($(id).value),rad=Math.PI/180,G=9.81,
f=(x,n=2)=>(Math.abs(x)<5*Math.pow(10,-n-1)?0:x).toFixed(n),
cards=a=>a.map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join(""),
bd=(ok,a,b)=>`<span class="badge ${ok?"ok":"bad"}">${ok?a:b}</span>`,
msg=t=>`<div class="r" style="grid-column:1/3"><span>Check your inputs</span><b>${t}</b></div>`,
F=(id,l,v)=>`<div><label>${l}</label><input id="${id}" type="number" step="any" value="${v}"></div>`,
S=(id,l,o)=>`<div><label>${l}</label><select id="${id}">${o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select></div>`,
C=(h,b)=>`<div class="card"><h2>${h}</h2>${b}</div>`,
bind=(s,fn)=>{$(s).addEventListener("input",fn);$(s).addEventListener("change",fn)},
bis=(fn,lo,hi)=>{for(let i=0;i<80;i++){const m=(lo+hi)/2;fn(m)>0?hi=m:lo=m}return(lo+hi)/2};
let lastQ=null;

/* ---------- Runoff (rational method) ---------- */
const CA=[{n:"Paved",A:"0.8",C:"0.90"},{n:"Roofs",A:"0.5",C:"0.95"},{n:"Grass",A:"2.7",C:"0.25"}];
$("hro").innerHTML=C("Catchment surfaces",`<div class="sc" id="crows"></div><button id="cadd" class="mt">+ Add surface</button>`)+
C("Time of concentration",`<div class="grid">${S("rM","Method",[["kir","Kirpich (channelised flow)"],["ker","Kerby (overland flow)"],["man","Enter tc directly"]])}${F("rL","Flow length L (m)",600)}${F("rS","Average slope (%)",2)}
${F("rN","Kerby retardance N",0.3)}${F("rTm","Manual tc (min)",20)}${F("rTp","Added pipe flow time (min)",0)}</div>
<div class="note">Kirpich: tc = 0.0195 L^0.77 S^−0.385. Kerby: tc = 1.44 (N L / √S)^0.467, valid for overland lengths up to about 365 m. N: 0.02 smooth pavement, 0.10 bare soil, 0.30 poor grass, 0.40 average grass, 0.80 dense grass.</div>`)+
C("Rainfall intensity (IDF)",`<div class="grid">${F("rA","a",1500)}${F("rB","b (min)",10)}${F("rn","n",0.8)}${F("rI","Direct intensity override (mm/h, optional)","")}</div>
<div class="note">i = a / (tc + b)^n for your chosen return period. The defaults are placeholders, so replace them with the IDF coefficients for your site. The time used is never less than 5 minutes.</div>`)+
C("Peak flow",`<div class="res" id="rres"></div><div class="mt"><button id="toPipe">Use this flow in Pipe tab</button></div><div id="rplot" class="mt"></div>`);
function cRows(){$("crows").innerHTML='<table><tr><th>Surface</th><th>Area (ha)</th><th>C</th><th></th></tr>'+CA.map((r,i)=>`<tr><td><input class="w" data-i="${i}" data-k="n" value="${r.n}"></td><td><input data-i="${i}" data-k="A" value="${r.A}"></td><td><input data-i="${i}" data-k="C" value="${r.C}"></td><td><button data-del="${i}" aria-label="Remove">×</button></td></tr>`).join("")+"</table>"}
function ro(){
  let sA=0,sCA=0;
  for(const r of CA){const A=+r.A,c=+r.C;if(!(A>0)||!(c>=0&&c<=1)){$("rres").innerHTML=msg("Each surface needs an area above 0 and C between 0 and 1.");$("rplot").innerHTML="";lastQ=null;return}sA+=A;sCA+=A*c}
  const Cc=sCA/sA,m=$("rM").value,L=g("rL"),Sp=g("rS")/100,N=g("rN"),tp=g("rTp")||0;let tc;
  if(m=="man")tc=g("rTm");else{if(!(L>0)||!(Sp>0)){$("rres").innerHTML=msg("L and slope must be above 0.");$("rplot").innerHTML="";lastQ=null;return}
    tc=m=="kir"?.0195*Math.pow(L,.77)*Math.pow(Sp,-.385):1.44*Math.pow(N*L/Math.sqrt(Sp),.467)}
  const a=g("rA"),b=g("rB"),n=g("rn"),ov=g("rI");
  if(!(tc>=0)||!(a>0)||!(n>0)||!isFinite(b)){$("rres").innerHTML=msg("Check tc and the IDF coefficients.");$("rplot").innerHTML="";lastQ=null;return}
  const tu=Math.max(tc+tp,5),iD=a/Math.pow(tu+b,n),i=ov>0?ov:iD,Q=.00278*Cc*i*sA;lastQ=Q;
  $("rres").innerHTML=cards([["Total area",f(sA)+" ha"],["Composite C",f(Cc,3)],["tc used",f(tu,1)+" min"],["Intensity i",f(i,1)+" mm/h"],["Peak flow Q",f(Q,3)+" m³/s"],["Peak flow",f(Q*1000,0)+" L/s"]]);
  const W=360,H=210,pl=40,pr=10,pt=12,pb=28,ym=a/Math.pow(5+b,n)*1.05,xs=d=>pl+(d-5)/115*(W-pl-pr),ys=v=>H-pb-v/ym*(H-pt-pb);let d_="";
  for(let d=5;d<=120;d+=5)d_+=(d>5?"L":"M")+xs(d).toFixed(1)+","+ys(a/Math.pow(d+b,n)).toFixed(1);
  const tk=[30,60,90,120].map(d=>`<text x="${xs(d)}" y="${H-10}" font-size="11" fill="var(--mut)" text-anchor="middle">${d}</text>`).join("");
  $("rplot").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--mut)"/><line x1="${pl}" x2="${pl}" y1="${pt}" y2="${H-pb}" stroke="var(--mut)"/>
  <path d="${d_}" fill="none" stroke="var(--c1)" stroke-width="2"/><circle cx="${xs(Math.min(tu,120))}" cy="${ys(iD)}" r="4" fill="var(--c2)"/>${tk}
  <text x="${pl-4}" y="${pt+8}" font-size="11" fill="var(--mut)" text-anchor="end">${f(ym/1.05,0)}</text><text x="${pl-4}" y="${H-pb}" font-size="11" fill="var(--mut)" text-anchor="end">0</text>
  <text x="${W/2}" y="${H-0}" font-size="11" fill="var(--mut)" text-anchor="middle">Duration (min), intensity (mm/h)</text></svg>`}
$("hro").addEventListener("input",e=>{const i=e.target.dataset.i;if(i!==undefined)CA[i][e.target.dataset.k]=e.target.value;ro()});
$("hro").addEventListener("change",ro);
$("hro").addEventListener("click",e=>{const d=e.target.dataset.del;
  if(d!==undefined&&CA.length>1){CA.splice(+d,1);cRows();ro()}
  if(e.target.id=="cadd"){CA.push({n:"",A:"",C:""});cRows();ro()}
  if(e.target.id=="toPipe"&&lastQ){$("pQ").value=f(lastQ,3);$("hpi").hidden=false;$("hro").hidden=true;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t=="hpi"));pp()}});

/* ---------- Pipe sizing (Manning, circular) ---------- */
const SZ=[150,225,300,375,450,525,600,675,750,900,1050,1200,1350,1500,1800,2100];
$("hpi").innerHTML=C("Design flow and pipe",`<div class="grid">${F("pQ","Design flow Q (m³/s)",0.8)}${F("pN","Manning n",0.013)}${F("pS","Gradient (%)",1)}${F("pV1","Minimum velocity (m/s)",0.75)}${F("pV2","Maximum velocity (m/s)",3)}</div>
<div class="note">Typical n: 0.011 to 0.013 concrete and uPVC, 0.024 corrugated metal. The check also requires d/D no greater than 0.8 at design flow.</div>`)+
C("Pipe sizes",`<div id="pres" class="res"></div><div class="sc mt" id="ptbl"></div>`);
function pp(){
  const Q=g("pQ"),n=g("pN"),Sg=g("pS")/100,v1=g("pV1"),v2=g("pV2");
  if(!(Q>0)||!(n>0)||!(Sg>0)){$("pres").innerHTML=msg("Q, n and gradient must be above 0.");$("ptbl").innerHTML="";return}
  const Dt=Math.pow(3.2086*n*Q/Math.sqrt(Sg),3/8),R=SZ.map(d=>{const D=d/1000,A=Math.PI*D*D/4,Vf=Math.pow(D/4,2/3)*Math.sqrt(Sg)/n,Qf=Vf*A,r=Q/Qf;let dd=null,V=null;
    if(r<=1.0757){const th=bis(t=>{const a=D*D/8*(t-Math.sin(t));return a*Math.pow(a/(D*t/2),2/3)*Math.sqrt(Sg)/n-Q},1e-4,5.27),a=D*D/8*(th-Math.sin(th));dd=(1-Math.cos(th/2))/2;V=Q/a}
    const s=r>1?"Under capacity":V<v1?"V too low":V>v2?"V too high":dd>.8?"d/D above 0.8":"OK";return{d,Qf,Vf,r,dd,V,s}}),
    fi=R.findIndex(r=>r.s=="OK"),st=Math.max(0,R.findIndex(r=>r.Qf>=.5*Q));
  $("pres").innerHTML=cards([["Theoretical full-flow D",f(Dt*1000,0)+" mm"],["Recommended size",fi>=0?R[fi].d+" mm":"None in list"]]);
  $("ptbl").innerHTML='<table><tr><th>D (mm)</th><th>Qfull</th><th>Vfull</th><th>Q/Qfull</th><th>d/D</th><th>V (m/s)</th><th>Status</th></tr>'+
    R.slice(st,st+7).map((r,i)=>`<tr class="${R.indexOf(r)==fi?"hl":""}"><td>${r.d}</td><td>${f(r.Qf,3)}</td><td>${f(r.Vf)}</td><td>${f(r.r,2)}</td><td>${r.dd==null?"surcharged":f(r.dd,2)}</td><td>${r.V==null?"":f(r.V)}</td><td>${r.s}</td></tr>`).join("")+"</table>"}
bind("hpi",pp);

/* ---------- Open channel (trapezoidal) ---------- */
$("hch").innerHTML=C("Channel",`<div class="grid">${F("cQ","Design flow Q (m³/s)",2.5)}${F("cB","Bottom width b (m, 0 for triangular)",1.5)}${F("cZ","Side slope z (H : 1V, 0 for rectangular)",1.5)}${F("cN","Manning n",0.03)}${F("cS","Bed slope (%)",0.3)}${F("cD","Channel depth (m)",1.2)}</div>
<div class="note">Typical n: 0.013 smooth concrete, 0.030 earth, 0.035 grass-lined, 0.040 to 0.050 weedy or stony.</div>`)+
C("Normal depth and regime",`<div class="res" id="cres"></div><div id="cchk" class="mt"></div><div id="cplot" class="mt"></div>`);
function ch(){
  const Q=g("cQ"),b=g("cB"),z=g("cZ"),n=g("cN"),Sg=g("cS")/100,Dc=g("cD");
  if(!(Q>0)||!(b>=0)||!(z>=0)||b+z<=0||!(n>0)||!(Sg>0)||!(Dc>0)){$("cres").innerHTML=msg("Q, n, slope and depth above 0, with b or z above 0.");$("cchk").innerHTML=$("cplot").innerHTML="";return}
  const A=y=>(b+z*y)*y,P=y=>b+2*y*Math.sqrt(1+z*z),T=y=>b+2*z*y,Qn=y=>A(y)*Math.pow(A(y)/P(y),2/3)*Math.sqrt(Sg)/n,
    y=bis(v=>Qn(v)-Q,1e-4,60),yc=bis(v=>1-Q*Q*T(v)/(G*Math.pow(A(v),3)),1e-4,60),a=A(y),V=Q/a,Fr=V/Math.sqrt(G*a/T(y)),R=a/P(y),Qf=Qn(Dc);
  $("cres").innerHTML=cards([["Normal depth y",f(y,3)+" m"],["Flow area",f(a,3)+" m²"],["Velocity",f(V)+" m/s"],["Froude number",f(Fr,2)],["Critical depth yc",f(yc,3)+" m"],
    ["Specific energy",f(y+V*V/2/G,3)+" m"],["Bed shear (γRS)",f(G*R*Sg,1)+" kPa"],["Capacity at full depth",f(Qf,2)+" m³/s"]]);
  $("cchk").innerHTML=`Regime: <b>${Fr<.95?"Subcritical":Fr>1.05?"Supercritical":"Near critical, avoid"}</b>. Freeboard ${f(Dc-y,2)} m: ${bd(y<=Dc,"CONTAINED","OVERTOPS")}`;
  const tw=b+2*z*Dc,sc=Math.min(300/tw,140/Dc),cx=180,y0=170,X=(o)=>cx+o*sc,Y=h=>y0-h*sc,w=Math.min(y,Dc*1.05);
  $("cplot").innerHTML=`<svg viewBox="0 0 360 190" role="img"><polygon points="${X(-b/2-z*w)},${Y(w)} ${X(b/2+z*w)},${Y(w)} ${X(b/2)},${Y(0)} ${X(-b/2)},${Y(0)}" fill="var(--c1)" fill-opacity=".25"/>
  <polyline points="${X(-b/2-z*Dc)},${Y(Dc)} ${X(-b/2)},${Y(0)} ${X(b/2)},${Y(0)} ${X(b/2+z*Dc)},${Y(Dc)}" fill="none" stroke="var(--tx)" stroke-width="2.5"/>
  <text x="${cx}" y="${Y(0)+16}" font-size="12" fill="var(--mut)" text-anchor="middle">y = ${f(y,2)} m</text></svg>`}
bind("hch",ch);

/* ---------- Culvert (circular, FHWA HDS-5 form) ---------- */
const IT={sq:{k:.0098,m:2,c:.0398,y:.67,ke:.5},gh:{k:.0018,m:2,c:.0292,y:.74,ke:.2},gp:{k:.0045,m:2,c:.0317,y:.69,ke:.2}};
$("hcu").innerHTML=C("Circular concrete culvert",`<div class="grid">${F("uQ","Design flow Q (m³/s)",1)}${F("uD","Diameter D (m)",0.9)}${F("uL","Length L (m)",20)}${F("uS","Barrel slope (%)",1)}${F("uN","Manning n",0.013)}${F("uT","Tailwater above outlet invert (m)",0.3)}
${S("uI","Inlet type",[["sq","Square edge with headwall"],["gh","Groove end with headwall"],["gp","Groove end, projecting"]])}</div>
<div class="note">Inlet control uses FHWA HDS-5 coefficients for circular concrete pipe. Outlet control uses the energy equation with a full barrel. The larger headwater governs. Verify against your design manual.</div>`)+
C("Headwater and control",`<div class="res" id="ures"></div><div id="uchk" class="mt"></div>`);
function cu(){
  const Q=g("uQ"),D=g("uD"),L=g("uL"),Sg=g("uS")/100,n=g("uN"),TW=g("uT")||0,I=IT[$("uI").value];
  if(!(Q>0)||!(D>0)||!(L>0)||!(n>0)||!(Sg>=0)){$("ures").innerHTML=msg("Q, D, L and n must be above 0 and slope not negative.");$("uchk").innerHTML="";return}
  const Af=Math.PI*D*D/4,th=y=>2*Math.acos(1-2*y/D),Ay=y=>D*D/8*(th(y)-Math.sin(th(y))),Ty=y=>D*Math.sin(th(y)/2),
    dc=bis(y=>1-Q*Q*Ty(y)/(G*Math.pow(Ay(y),3)),1e-4,D*.9999),Vc=Q/Ay(dc),Hc=dc+Vc*Vc/2/G,
    Qn=1.811*Q/(Af*Math.sqrt(D)),us=Hc/D+I.k*Math.pow(Qn,I.m)-.5*Sg,sb=I.c*Qn*Qn+I.y-.5*Sg,
    hwD=Qn<=3.5?us:Qn>=4?sb:us+(sb-us)*(Qn-3.5)/.5,HWi=hwD*D,V=Q/Af,R=D/4,
    H=(1+I.ke+2*G*n*n*L/Math.pow(R,4/3))*V*V/2/G,ho=Math.max(TW,(dc+D)/2),HWo=H+ho-Sg*L,HW=Math.max(HWi,HWo),yo=Math.min(Math.max(dc,TW),D);
  $("ures").innerHTML=cards([["Critical depth dc",f(dc,3)+" m"],["Inlet control HW",f(HWi,2)+" m"],["Outlet control HW",f(HWo,2)+" m"],["Design headwater HW",f(HW,2)+" m"],
    ["HW / D",f(HW/D,2)],["Control",HWi>=HWo?"Inlet":"Outlet"],["Barrel velocity (full)",f(V)+" m/s"],["Outlet velocity",f(Q/Ay(yo))+" m/s"]]);
  $("uchk").innerHTML=`HW/D vs the common limit of 1.2: ${bd(HW/D<=1.2,"WITHIN LIMIT","EXCEEDS LIMIT")}<div class="note">Q / (A √D) factor ${f(Qn,2)} (SI, includes 1.811). Compare HW with the road level or embankment crest minus the inlet invert.</div>`}
bind("hcu",cu);

$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===e.target));
  ["hro","hpi","hch","hcu"].forEach(s=>$(s).hidden=s!=t)};
cRows();ro();pp();ch();cu();
</script>
</body>
</html>

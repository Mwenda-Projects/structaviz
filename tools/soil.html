<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soil Mechanics Toolkit</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--bd:#dedcd4;--ac:#7a4a1d;--ok:#1f7a4d;--bad:#b3261e;--c1:#2563a8;--c2:#b8470f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#211f1c;--tx:#f0eee8;--mut:#a29f95;--bd:#38352f;--ac:#c98b4f;--ok:#5fd39a;--bad:#ff8a80;--c1:#6fa8e8;--c2:#f0894f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--card:#211f1c;--tx:#f0eee8;--mut:#a29f95;--bd:#38352f;--ac:#c98b4f;--ok:#5fd39a;--bad:#ff8a80;--c1:#6fa8e8;--c2:#f0894f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:700px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
p.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;padding:8px 12px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.r b{display:block;font-size:17px}.r span{font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.sc td input{width:72px;padding:6px}
svg{width:100%;height:auto;display:block}
.note{font-size:12px;color:var(--mut);margin-top:6px}.mt{margin-top:10px}
</style>
<link rel="stylesheet" href="structaviz-tools.css">
<script src="structaviz-tools.js"></script>
</head>
<body>
<main>
<h1>Soil Mechanics Toolkit</h1>
<p class="sub">Units: m, kN, kPa, kN/m³. Effective stress analysis unless stated.</p>
<div class="tabs" id="tabs"><button data-t="tbc" class="on">Bearing</button><button data-t="tst">Settlement</button><button data-t="tmo">Mohr</button><button data-t="tep">Earth pressure</button><button data-t="tix">Index</button></div>
<section id="tbc"></section><section id="tst" hidden></section><section id="tmo" hidden></section><section id="tep" hidden></section><section id="tix" hidden></section>
</main>
<script>
const $=id=>document.getElementById(id),g=id=>parseFloat($(id).value),rad=Math.PI/180,GW=9.81,
f=(x,n=2)=>(Math.abs(x)<5*Math.pow(10,-n-1)?0:x).toFixed(n),
cards=a=>a.map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join(""),
bd=(ok,a,b)=>`<span class="badge ${ok?"ok":"bad"}">${ok?a:b}</span>`,
msg=t=>`<div class="r" style="grid-column:1/3"><span>Check your inputs</span><b>${t}</b></div>`,
F=(id,l,v)=>`<div><label>${l}</label><input id="${id}" type="number" step="any" value="${v}"></div>`,
S=(id,l,o)=>`<div><label>${l}</label><select id="${id}">${o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select></div>`,
C=(h,b)=>`<div class="card"><h2>${h}</h2>${b}</div>`,
bind=(s,fn)=>{$(s).addEventListener("input",fn);$(s).addEventListener("change",fn)};

/* ---------- Bearing capacity ---------- */
$("tbc").innerHTML=C("Bearing capacity (general shear)",`<div class="grid">
${S("bm","Method",[["mey","Meyerhof (1963)"],["ves","Vesic (1973)"],["ter","Terzaghi (1943)"]])}
${S("bs","Foundation shape",[["sq","Square"],["strip","Strip"],["rect","Rectangular"],["circ","Circular"]])}
${F("bB","Width B or diameter (m)",2)}${F("bL","Length L (m, rectangular)",3)}${F("bDf","Founding depth Df (m)",1.5)}${F("bC","Cohesion c (kPa)",0)}
${F("bP","Friction angle φ (°)",30)}${F("bG","γ above water table",17)}${F("bGs","γsat below water table",19.5)}${F("bDw","Water table depth (m)",3)}
${F("bFS","Factor of safety",3)}${F("bQ","Column load Q (kN, or kN/m for strip)",1200)}</div>`)+
C("Results",`<div class="res" id="bres"></div><div id="bchk" class="mt"></div><div class="sc mt" id="bfac"></div>
<div class="note">Water table: γ′ = γsat − 9.81. Between Df and Df + B the weighted unit weight under the base is used. Inclination and eccentricity are not included, so use B′ = B − 2e for eccentric loads.</div>`);
const TG=[0,.5,1.2,2.5,5,9.7,19.7,42.4,100.4,297.5];
function tgN(p){const i=Math.min(Math.floor(p/5),8),t=Math.min((p-5*i)/5,1);return i?TG[i]*Math.pow(TG[i+1]/TG[i],t):TG[1]*t}
function bc(){
  const m=$("bm").value,sh=$("bs").value,B=g("bB"),Lg=g("bL"),Df=g("bDf"),c=g("bC")||0,ph=g("bP")||0,gm=g("bG"),gs=g("bGs"),Dw=g("bDw"),FS=g("bFS")||3,Q=g("bQ")||0;
  if(!(B>0)||!(Df>=0)||!(gm>0)||!(gs>0)||!(Dw>=0)||ph<0||ph>50||(sh=="rect"&&!(Lg>=B))){$("bres").innerHTML=msg("B above 0, L ≥ B, φ from 0 to 50°, and positive unit weights.");$("bchk").innerHTML=$("bfac").innerHTML="";return}
  const r=sh=="strip"?0:sh=="rect"?B/Lg:1,p=ph*rad,tn=Math.tan(p),gp=gs-GW;let q,ge;
  if(Dw<=Df){q=gm*Dw+gp*(Df-Dw);ge=gp}else{q=gm*Df;ge=Dw>=Df+B?gm:gp+(Dw-Df)/B*(gm-gp)}
  let Nq,Nc,Ng,sc=1,sq=1,sg=1,dc=1,dq=1,dg=1;
  if(m=="ter"){const a=Math.exp((.75*Math.PI-p/2)*tn);Nq=a*a/(2*Math.pow(Math.cos(Math.PI/4+p/2),2));Nc=ph?(Nq-1)/tn:5.7;Ng=tgN(ph);
    if(sh=="sq"){sc=1.3;sg=.8}else if(sh=="circ"){sc=1.3;sg=.6}else if(sh=="rect"){sc=1+.3*r;sg=1-.2*r}}
  else{Nq=Math.exp(Math.PI*tn)*Math.pow(Math.tan(Math.PI/4+p/2),2);Nc=ph?(Nq-1)/tn:5.14;
    if(m=="mey"){Ng=(Nq-1)*Math.tan(1.4*p);const Kp=Math.pow(Math.tan(Math.PI/4+p/2),2),sk=Math.sqrt(Kp);sc=1+.2*Kp*r;dc=1+.2*sk*Df/B;if(ph>10){sq=sg=1+.1*Kp*r;dq=dg=1+.1*sk*Df/B}}
    else{Ng=2*(Nq+1)*tn;sc=1+r*Nq/Nc;sq=1+r*tn;sg=Math.max(1-.4*r,.6);const k=Df/B<=1?Df/B:Math.atan(Df/B);dq=1+2*tn*Math.pow(1-Math.sin(p),2)*k;dc=ph?dq-(1-dq)/(Nc*tn):1+.4*k}}
  const qu=c*Nc*sc*dc+q*Nq*sq*dq+.5*ge*B*Ng*sg*dg,qn=qu-q,A=sh=="strip"?B:sh=="rect"?B*Lg:sh=="sq"?B*B:Math.PI*B*B/4,pr=Q/A,qa=qn/FS;
  $("bres").innerHTML=cards([["Overburden q at base",f(q)+" kPa"],["Ultimate qu (gross)",f(qu)+" kPa"],["Ultimate net (qu − q)",f(qn)+" kPa"],["Allowable net (qnet / FS)",f(qa)+" kPa"],
    ["Allowable gross (qu / FS)",f(qu/FS)+" kPa"],["Allowable load",f(qa*A,0)+(sh=="strip"?" kN/m":" kN")],["Applied pressure Q / A",f(pr)+" kPa"],["Utilisation",f(pr/qa*100,0)+" %"]]);
  $("bchk").innerHTML=`Load check (Q/A ≤ net allowable): ${bd(pr<=qa,"ADEQUATE","INADEQUATE")}`;
  $("bfac").innerHTML=`<table><tr><th>Factor</th><th>N</th><th>Shape s</th><th>Depth d</th></tr><tr><td>c term</td><td>${f(Nc)}</td><td>${f(sc,3)}</td><td>${f(dc,3)}</td></tr><tr><td>q term</td><td>${f(Nq)}</td><td>${f(sq,3)}</td><td>${f(dq,3)}</td></tr><tr><td>γ term</td><td>${f(Ng)}</td><td>${f(sg,3)}</td><td>${f(dg,3)}</td></tr></table>`}
bind("tbc",bc);

/* ---------- Settlement ---------- */
const L1=[{H:"3",z:"2.5",e:"0.9",cc:"0.30",cs:"0.06",s0:"60",sc:"80"},{H:"2",z:"5",e:"0.8",cc:"0.25",cs:"0.05",s0:"84",sc:"84"}];
$("tst").innerHTML=C("Foundation load (2:1 stress spread)",`<div class="grid">${F("sQ","Net applied pressure q (kPa)",150)}${F("sB","Width B (m)",2)}${F("sL","Length L (m, 0 for strip)",2)}</div>`)+
C("Clay layers",`<div class="sc" id="srows"></div><button id="sadd" class="mt">+ Add layer</button><div class="note">z is the depth from the footing base to the middle of the layer. σ′0 is the effective stress at mid-layer and σ′c the preconsolidation pressure (equal to σ′0 for normally consolidated clay).</div>`)+
C("Consolidation settlement",`<div class="sc" id="sres"></div><div class="res mt" id="stot"></div>`)+
C("Rate of settlement",`<div class="grid">${F("sCv","Cv (m²/year)",2)}${F("sH","Drainage path Hdr (m)",2.5)}${F("sT","Time t (years)",1)}</div><div class="res mt" id="stime"></div>`);
function sRows(){$("srows").innerHTML='<table><tr><th>#</th><th>H (m)</th><th>z (m)</th><th>e0</th><th>Cc</th><th>Cs</th><th>σ′0</th><th>σ′c</th><th></th></tr>'+
  L1.map((r,i)=>`<tr><td>${i+1}</td>${["H","z","e","cc","cs","s0","sc"].map(k=>`<td><input data-i="${i}" data-k="${k}" value="${r[k]}"></td>`).join("")}<td><button data-del="${i}" aria-label="Remove">×</button></td></tr>`).join("")+"</table>"}
function st(){
  const q=g("sQ"),B=g("sB"),Lg=g("sL")||0,cv=g("sCv"),hd=g("sH"),t=g("sT"),lg=Math.log10;let tot=0,t_='<table><tr><th>Layer</th><th>Δσ (kPa)</th><th>σ′0+Δσ</th><th>State</th><th>S (mm)</th></tr>';
  if(!(q>0)||!(B>0)){$("sres").innerHTML=msg("q and B must be above 0.");$("stot").innerHTML=$("stime").innerHTML="";return}
  for(let i=0;i<L1.length;i++){const r=L1[i],H=+r.H,z=+r.z,e=+r.e,cc=+r.cc,cs=+r.cs,s0=+r.s0,pc=+r.sc;
    if(!(H>0)||!(s0>0)||!(e>=0)||!(z>=0)){$("sres").innerHTML=msg("Layer "+(i+1)+" needs H, z, e0 and σ′0 above zero.");$("stot").innerHTML=$("stime").innerHTML="";return}
    const d=Lg>0?q*B*Lg/((B+z)*(Lg+z)):q*B/(B+z),s1=s0+d;let s,stt;
    if(pc<=s0){s=cc*H/(1+e)*lg(s1/s0);stt="NC"}else if(s1<=pc){s=cs*H/(1+e)*lg(s1/s0);stt="OC, recompression"}else{s=H/(1+e)*(cs*lg(pc/s0)+cc*lg(s1/pc));stt="OC to NC"}
    tot+=s;t_+=`<tr><td>${i+1}</td><td>${f(d)}</td><td>${f(s1)}</td><td>${stt}</td><td>${f(s*1000,1)}</td></tr>`}
  $("sres").innerHTML=t_+"</table>";$("stot").innerHTML=cards([["Total primary settlement",f(tot*1000,1)+" mm"]]);
  if(!(cv>0)||!(hd>0)){$("stime").innerHTML=msg("Cv and Hdr must be above 0.");return}
  const Tv=cv*(t||0)/(hd*hd),U=Tv<=.2827?Math.sqrt(4*Tv/Math.PI):1-Math.pow(10,-(Tv+.085)/.933);
  $("stime").innerHTML=cards([["Time factor Tv",f(Tv,3)],["Degree of consolidation U",f(Math.min(U,1)*100,1)+" %"],["Settlement at t",f(tot*Math.min(U,1)*1000,1)+" mm"],
    ["t50 (U = 50%)",f(.197*hd*hd/cv,2)+" years"],["t90 (U = 90%)",f(.848*hd*hd/cv,2)+" years"]])}
$("tst").addEventListener("input",e=>{const i=e.target.dataset.i;if(i!==undefined)L1[i][e.target.dataset.k]=e.target.value;st()});
$("tst").addEventListener("click",e=>{const d=e.target.dataset.del;
  if(d!==undefined&&L1.length>1){L1.splice(+d,1);sRows();st()}
  if(e.target.id=="sadd"){L1.push({H:"",z:"",e:"",cc:"",cs:"",s0:"",sc:""});sRows();st()}});

/* ---------- Mohr's circle ---------- */
$("tmo").innerHTML=C("Stress state (compression positive)",`<div class="grid">${F("mX","σx (kPa)",150)}${F("mY","σy (kPa)",60)}${F("mT","τxy (kPa)",30)}${F("mA","Plane angle θ (°)",25)}${F("mC","c (kPa)",10)}${F("mP","φ (°)",30)}</div>
<div class="note">For principal stresses, enter σ1 as σx, σ3 as σy and τxy = 0. θ is the angle of the plane’s normal from the x direction, anticlockwise.</div>`)+
C("Results",`<div class="res" id="mres"></div><div id="mchk" class="mt"></div>`)+C("Mohr circle",`<div id="mplot"></div><div class="note">Dashed lines: Mohr-Coulomb envelope τ = c + σ tan φ.</div>`);
function mo(){
  const sx=g("mX"),sy=g("mY"),tx=g("mT"),th=g("mA")||0,c=g("mC")||0,ph=g("mP")||0;
  if(![sx,sy,tx].every(isFinite)){$("mres").innerHTML=msg("Enter σx, σy and τxy.");$("mchk").innerHTML=$("mplot").innerHTML="";return}
  const cen=(sx+sy)/2,R=Math.hypot((sx-sy)/2,tx),s1=cen+R,s3=cen-R,a0=Math.atan2(tx,(sx-sy)/2),thp=.5*Math.atan2(2*tx,sx-sy)/rad,t=th*rad,
    sT=cen+R*Math.cos(a0-2*t),tT=R*Math.sin(a0-2*t),k=Math.tan(Math.PI/4+ph*rad/2),s1f=s3*k*k+2*c*k,tn=Math.tan(ph*rad);
  $("mres").innerHTML=cards([["Major principal σ1",f(s1)+" kPa"],["Minor principal σ3",f(s3)+" kPa"],["Max shear τmax",f(R)+" kPa"],["Centre, radius",f(cen)+", "+f(R)],
    ["σ1 plane angle",f(thp,1)+"° from x"],["Mean stress p",f(cen)+" kPa"],["σ on plane θ",f(sT)+" kPa"],["τ on plane θ",f(tT)+" kPa"]]);
  $("mchk").innerHTML=`σ1 at failure for this σ3: <b>${f(s1f)} kPa</b>. ${bd(s1<s1f,"BELOW ENVELOPE","AT OR BEYOND FAILURE")}<div class="note">Use effective stresses for drained analysis.</div>`;
  const W=360,H=270,pd=24,x0=Math.min(s3,0)-.05*R,x1=Math.max(s1,0)+.05*R,ym=Math.max(R,c)*1.15||1,sc=Math.min((W-2*pd)/((x1-x0)||1),(H-2*pd)/(2*ym)),ox=(W-(x1-x0)*sc)/2,
    X=v=>ox+(v-x0)*sc,Y=v=>H/2-v*sc,dot=(l,x,y,dx,dy)=>`<circle cx="${X(x)}" cy="${Y(y)}" r="4" fill="var(--c2)"/><text x="${X(x)+dx}" y="${Y(y)+dy}" font-size="12" fill="var(--tx)">${l}</text>`;
  $("mplot").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img"><line x1="${ox-8}" x2="${W-ox+8}" y1="${H/2}" y2="${H/2}" stroke="var(--mut)"/>
  ${x0<0&&x1>0?`<line x1="${X(0)}" x2="${X(0)}" y1="6" y2="${H-6}" stroke="var(--mut)"/>`:""}
  <line x1="${X(x0)}" y1="${Y(c+x0*tn)}" x2="${X(x1)}" y2="${Y(c+x1*tn)}" stroke="var(--c2)" stroke-dasharray="5 4"/><line x1="${X(x0)}" y1="${Y(-(c+x0*tn))}" x2="${X(x1)}" y2="${Y(-(c+x1*tn))}" stroke="var(--c2)" stroke-dasharray="5 4"/>
  <circle cx="${X(cen)}" cy="${Y(0)}" r="${R*sc}" fill="var(--c1)" fill-opacity=".12" stroke="var(--c1)" stroke-width="2"/>
  <line x1="${X(sx)}" y1="${Y(tx)}" x2="${X(sy)}" y2="${Y(-tx)}" stroke="var(--c1)" stroke-width="1"/>
  ${dot("X",sx,tx,6,-6)}${dot("Y",sy,-tx,-14,14)}${dot("θ",sT,tT,6,14)}
  <text x="${X(s1)}" y="${H/2+14}" font-size="11" fill="var(--tx)" text-anchor="middle">σ1</text><text x="${X(s3)}" y="${H/2+14}" font-size="11" fill="var(--tx)" text-anchor="middle">σ3</text>
  <text x="8" y="14" font-size="12" fill="var(--mut)">τ ↑</text><text x="${W-22}" y="${H/2-6}" font-size="12" fill="var(--mut)">σ →</text></svg>`}
bind("tmo",mo);

/* ---------- Rankine earth pressure ---------- */
$("tep").innerHTML=C("Rankine earth pressure",`<div class="grid">${F("eH","Wall height H (m)",5)}${F("eG","Unit weight γ (kN/m³)",18)}${F("eP","φ (°)",30)}${F("eC","c (kPa)",0)}${F("eQ","Surcharge q (kPa)",10)}${F("eHp","Passive embedment Hp (m)",1.5)}</div>
<div class="note">Smooth vertical wall, horizontal dry backfill. Tension cracks carry no stress, so negative pressure is neglected.</div>`)+
C("Results",`<div class="res" id="eres"></div><div id="eplot" class="mt"></div>`);
function ep(){
  const H=g("eH"),ga=g("eG"),ph=g("eP")||0,c=g("eC")||0,q=g("eQ")||0,Hp=g("eHp")||0;
  if(!(H>0)||!(ga>0)||ph<0||ph>50){$("eres").innerHTML=msg("H and γ above 0, φ between 0 and 50°.");$("eplot").innerHTML="";return}
  const Ka=Math.pow(Math.tan(Math.PI/4-ph*rad/2),2),Kp=1/Ka,sKa=Math.sqrt(Ka),sKp=Math.sqrt(Kp),sT=Ka*q-2*c*sKa,sB=Ka*ga*H+Ka*q-2*c*sKa,zc=Math.max((2*c*sKa-Ka*q)/(Ka*ga),0),
    p0=2*c*sKp,pB=p0+Kp*ga*Hp,Pp=.5*(p0+pB)*Hp,ap=Pp>0?Hp*(pB+2*p0)/(3*(p0+pB)):0;
  let Pa=0,ya=0,rows=[["Ka",f(Ka,3)],["Kp",f(Kp,3)],["Tension crack depth",f(zc)+" m"]];
  if(sB>0){const st_=Math.max(sT,0),h=H-zc;Pa=.5*(st_+sB)*h;ya=h*(sB+2*st_)/(3*(st_+sB))}
  rows.push(["σa at base",f(Math.max(sB,0))+" kPa"],["Active thrust Pa",f(Pa)+" kN/m"],["Pa acts above base",f(ya)+" m"],["Passive thrust Pp",f(Pp)+" kN/m"],["Pp acts above base",f(ap)+" m"]);
  $("eres").innerHTML=cards(rows);
  if(sB<=0){$("eplot").innerHTML='<div class="note">Cohesion carries the full height, so there is no active thrust on this wall.</div>';return}
  const sy=170/H,ws=190/sB,y0=15+zc*sy,st2=Math.max(sT,0);
  $("eplot").innerHTML=`<svg viewBox="0 0 360 210" role="img"><line x1="30" x2="30" y1="15" y2="${15+H*sy}" stroke="var(--tx)" stroke-width="3"/><line x1="10" x2="350" y1="15" y2="15" stroke="var(--mut)"/>
  <polygon points="30,${y0} ${30+st2*ws},${y0} ${30+sB*ws},${15+H*sy} 30,${15+H*sy}" fill="var(--c2)" fill-opacity=".2" stroke="var(--c2)" stroke-width="2"/>
  <text x="${34+sB*ws}" y="${15+H*sy-4}" font-size="12" fill="var(--tx)" text-anchor="end">${f(sB)} kPa</text>
  ${zc>0?`<text x="36" y="${(15+y0)/2+4}" font-size="11" fill="var(--mut)">tension crack ${f(zc)} m</text>`:""}</svg>`}
bind("tep",ep);

/* ---------- Index properties ---------- */
$("tix").innerHTML=C("Phase relations",`<div class="grid">${F("iG","Specific gravity Gs",2.70)}${F("iW","Water content w (%)",20)}
${S("iM","Second known",[["e","Void ratio e"],["S","Saturation S (%)"],["g","Bulk unit weight (kN/m³)"]])}${F("iV","Value",0.65)}${F("iEx","e max (optional)","")}${F("iEn","e min (optional)","")}</div>
<div class="res mt" id="ires"></div>`)+
C("Atterberg limits (fine-grained soil)",`<div class="grid">${F("aL","Liquid limit LL (%)",48)}${F("aP","Plastic limit PL (%)",24)}</div><div class="res mt" id="ares"></div><div class="note">Uses the water content above as the natural moisture content. The A-line is PI = 0.73 (LL − 20). This is indicative only, since the full USCS class also depends on the grading.</div>`)+
C("Grading",`<div class="grid">${F("gA","D10 (mm)",0.08)}${F("gB","D30 (mm)",0.4)}${F("gC","D60 (mm)",1.2)}${S("gT","Dominant fraction",[["s","Sand"],["g","Gravel"]])}</div><div class="res mt" id="gres"></div>`);
function ix(){
  const Gs=g("iG"),w=(g("iW")||0)/100,v=g("iV"),m=$("iM").value;let e=m=="e"?v:m=="S"?w*Gs/(v/100):Gs*GW*(1+w)/v-1;
  if(!(Gs>0)||!(e>0)||!isFinite(e)){$("ires").innerHTML=msg("Gs and the second value must give a positive void ratio.")}else{
    const Sr=w*Gs/e*100,emx=g("iEx"),emn=g("iEn"),rows=[["Void ratio e",f(e,3)],["Porosity n",f(e/(1+e)*100,1)+" %"],["Saturation S",f(Sr,1)+" %"],["Bulk γ",f(Gs*GW*(1+w)/(1+e))+" kN/m³"],
      ["Dry γd",f(Gs*GW/(1+e))+" kN/m³"],["Saturated γsat",f((Gs+e)*GW/(1+e))+" kN/m³"],["Submerged γ′",f((Gs+e)*GW/(1+e)-GW)+" kN/m³"]];
    if(isFinite(emx)&&isFinite(emn)&&emx>emn)rows.push(["Relative density Dr",f((emx-e)/(emx-emn)*100,0)+" %"]);
    $("ires").innerHTML=cards(rows)+(Sr>100.5?msg("S above 100%: the inputs are inconsistent."):"")}
  const LL=g("aL"),PL=g("aP"),wn=w*100;
  if(!(LL>PL)||!isFinite(PL)){$("ares").innerHTML=msg("LL must be greater than PL.")}else{
    const PI=LL-PL,LI=(wn-PL)/PI,Al=.73*(LL-20),hi=LL>=50;let cl;
    if(PI<4||PI<Al)cl=hi?"MH, elastic silt":"ML, silt";else if(PI<=7)cl="CL-ML, silty clay";else cl=hi?"CH, fat clay":"CL, lean clay";
    $("ares").innerHTML=cards([["Plasticity index PI",f(PI,1)+" %"],["Liquidity index LI",f(LI,2)],["State",LI<0?"Semi-solid":LI<=1?"Plastic":"Liquid"],["A-line PI at this LL",f(Al,1)+" %"],["Indicative class",cl]])}
  const a=g("gA"),b=g("gB"),c=g("gC");
  if(!(a>0&&b>0&&c>0)||!(a<=b&&b<=c)){$("gres").innerHTML=msg("Use D10 ≤ D30 ≤ D60, all above 0.")}else{
    const Cu=c/a,Cc=b*b/(a*c),ok=Cc>=1&&Cc<=3&&Cu>=($("gT").value=="g"?4:6);
    $("gres").innerHTML=cards([["Uniformity Cu = D60 / D10",f(Cu,2)],["Curvature Cc = D30² / (D10 D60)",f(Cc,2)],["Grading",ok?"Well graded":"Poorly graded"]])}}
bind("tix",ix);

$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===e.target));
  ["tbc","tst","tmo","tep","tix"].forEach(s=>$(s).hidden=s!=t)};
sRows();bc();st();mo();ep();ix();
</script>

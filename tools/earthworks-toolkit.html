<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earthworks and Quantities Toolkit</title>
<style>
:root{--bg:#f7f5f1;--card:#fff;--tx:#1f1d1a;--mut:#6c675f;--bd:#dfdacf;--ac:#9a5b12;--ok:#1f7a4d;--bad:#b3261e;--c1:#2563a8;--c2:#b8470f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--tx:#f1ede5;--mut:#a59f93;--bd:#393429;--ac:#f0a24a;--ok:#5fd39a;--bad:#ff8a80;--c1:#6fa8e8;--c2:#f0894f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--tx:#f1ede5;--mut:#a59f93;--bd:#393429;--ac:#f0a24a;--ok:#5fd39a;--bad:#ff8a80;--c1:#6fa8e8;--c2:#f0894f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:700px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
p.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){.tabs button.on{color:#201402}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;padding:8px 12px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.r b{display:block;font-size:17px}.r span{font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.sc td input{width:88px;padding:6px}.sc td input.w{width:170px}.sc td input.u{width:56px}
tr.tot td{font-weight:700}
svg{width:100%;height:auto;display:block}
.note{font-size:12px;color:var(--mut);margin-top:6px}.mt{margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap}
</style>
<link rel="stylesheet" href="structaviz-tools.css">
<script src="structaviz-tools.js"></script>
</head>
<body>
<main>
<h1>Earthworks and Quantities Toolkit</h1>
<p class="sub">SI units. Volumes in m³, areas in m², distances in m.</p>
<div class="tabs" id="tabs"><button data-t="xsec" class="on">Sections</button><button data-t="xmass">Mass haul</button><button data-t="xtr">Trench</button><button data-t="xbq">BoQ</button></div>
<section id="xsec"></section><section id="xmass" hidden></section><section id="xtr" hidden></section><section id="xbq" hidden></section>
</main>
<script>
const $=id=>document.getElementById(id),g=id=>parseFloat($(id).value),
f=(x,n=2)=>(Math.abs(x)<5*Math.pow(10,-n-1)?0:x).toFixed(n),
n2=x=>x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}),
cards=a=>a.map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join(""),
bd=(ok,a,b)=>`<span class="badge ${ok?"ok":"bad"}">${ok?a:b}</span>`,
msg=t=>`<div class="r" style="grid-column:1/3"><span>Check your inputs</span><b>${t}</b></div>`,
F=(id,l,v,c="")=>`<div${c?` class="${c}"`:""}><label>${l}</label><input id="${id}" type="number" step="any" value="${v}"></div>`,
S=(id,l,o)=>`<div><label>${l}</label><select id="${id}">${o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select></div>`,
C=(h,b)=>`<div class="card"><h2>${h}</h2>${b}</div>`,
bind=(s,fn)=>{$(s).addEventListener("input",fn);$(s).addEventListener("change",fn)};
async function copy(t,b,lab){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();try{ok=document.execCommand("copy")}catch(x){}a.remove()}
  b.textContent=ok?"Copied":"Copy blocked here";setTimeout(()=>b.textContent=lab,1600)}
let lastSec=null,lastTr=null;

/* ---------- Cross-section volumes ---------- */
const SXs={lev:[["0","101.2","100"],["20","100.8","100"],["40","100.1","100"],["60","99.4","100"],["80","98.9","100"],["100","98.5","100"],["120","99.3","100"],["140","100.4","100"],["160","101.0","100"]].map(r=>({x:r[0],a:r[1],b:r[2]})),
  area:[["0","12","0"],["20","8","0"],["40","0","6"],["60","0","14"]].map(r=>({x:r[0],a:r[1],b:r[2]}))};
$("xsec").innerHTML=C("Section setup",`<div class="grid">${S("xm","Input mode",[["lev","Levels (level ground sections)"],["area","Areas (from drawn sections)"]])}
${F("xB","Formation width b (m)",7,"lv")}${F("xSc","Cut side slope (H : 1V)",1.5,"lv")}${F("xSf","Fill side slope (H : 1V)",2,"lv")}</div>
<div class="note">Level mode uses area = (b + s·h)·h for each section, with h the depth of cut or height of fill at the centreline. It ignores cross-fall, so use area mode for sloping ground.</div>`)+
C("Stations",`<div class="sc" id="xrows"></div><button id="xadd" class="mt">+ Add station</button>`)+
C("Volumes",`<div class="res" id="xres"></div><div id="xchk" class="mt"></div><div class="sc mt" id="xtbl"></div>
<div class="note">Average end area, with the pyramid formula where a section changes from cut to fill. Volumes are in bank (cut) and design (fill) measure.</div>`);
function xRows(){const lv=$("xm").value=="lev",h=lv?["Chainage (m)","Ground level (m)","Formation level (m)"]:["Chainage (m)","Cut area (m²)","Fill area (m²)"];
  $("xrows").innerHTML=`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}<th></th></tr>`+SXs[$("xm").value].map((r,i)=>`<tr>${["x","a","b"].map(k=>`<td><input data-i="${i}" data-k="${k}" value="${r[k]}"></td>`).join("")}<td><button data-del="${i}" aria-label="Remove">×</button></td></tr>`).join("")+"</table>"}
function secData(){
  const m=$("xm").value,A=SXs[m],bw=g("xB"),sc=g("xSc")||0,sf=g("xSf")||0,st=[],n=A.length;
  if(n<2)return{e:"Add at least two stations."};
  for(const r of A){const x=parseFloat(r.x),a=parseFloat(r.a),b=parseFloat(r.b);if(![x,a,b].every(isFinite))return{e:"Every station needs three numbers."};let c,fa;
    if(m=="lev"){if(!(bw>0))return{e:"Formation width must be above 0."};const h=a-b;c=h>0?(bw+sc*h)*h:0;fa=h<0?(bw+sf*-h)*-h:0}else{if(a<0||b<0)return{e:"Areas cannot be negative."};c=a;fa=b}
    st.push({x,c,f:fa})}
  for(let i=1;i<n;i++)if(!(st[i].x>st[i-1].x))return{e:"Chainages must increase down the list."};
  const sg=[];let tc=0,tf=0;
  for(let i=1;i<n;i++){const p=st[i-1],q=st[i],L=q.x-p.x;let vc,vf;
    if(p.f==0&&q.c==0&&p.c>0&&q.f>0){const s=p.c+q.f;vc=L*p.c*p.c/(2*s);vf=L*q.f*q.f/(2*s)}
    else if(p.c==0&&q.f==0&&p.f>0&&q.c>0){const s=p.f+q.c;vf=L*p.f*p.f/(2*s);vc=L*q.c*q.c/(2*s)}
    else{vc=L*(p.c+q.c)/2;vf=L*(p.f+q.f)/2}
    tc+=vc;tf+=vf;sg.push({L,vc,vf,cc:tc,cf:tf})}
  let sp=null;const h=st[1].x-st[0].x;
  if(n%2==1&&st.slice(1).every((q,i)=>Math.abs(q.x-st[i].x-h)<1e-6)){const s3=k=>h/3*st.reduce((s,q,i)=>s+q[k]*(i==0||i==n-1?1:i%2?4:2),0);sp={c:s3("c"),f:s3("f")}}
  return{st,sg,tc,tf,sp}}
function renderSec(d){
  if(d.e){$("xres").innerHTML=msg(d.e);$("xchk").innerHTML=$("xtbl").innerHTML="";return}
  $("xres").innerHTML=cards([["Total cut (bank)",f(d.tc,1)+" m³"],["Total fill",f(d.tf,1)+" m³"],["Length",f(d.st[d.st.length-1].x-d.st[0].x,1)+" m"],["Net (cut − fill)",f(d.tc-d.tf,1)+" m³"]]);
  $("xchk").innerHTML=d.sp?`Prismoidal (Simpson) check: cut ${f(d.sp.c,1)} m³ (${f((d.sp.c-d.tc)/(d.tc||1)*100,1)}%), fill ${f(d.sp.f,1)} m³ (${f((d.sp.f-d.tf)/(d.tf||1)*100,1)}%). Differences near cut-to-fill changes are expected.`:'<span class="note">Simpson check needs an odd number of evenly spaced stations.</span>';
  $("xtbl").innerHTML='<table><tr><th>Chainage</th><th>Cut A</th><th>Fill A</th><th>Cut V</th><th>Fill V</th><th>Cum cut</th><th>Cum fill</th></tr>'+
    d.st.map((p,i)=>{const s=d.sg[i-1];return `<tr><td>${f(p.x,1)}</td><td>${f(p.c)}</td><td>${f(p.f)}</td><td>${s?f(s.vc,1):""}</td><td>${s?f(s.vf,1):""}</td><td>${s?f(s.cc,1):"0.0"}</td><td>${s?f(s.cf,1):"0.0"}</td></tr>`}).join("")+"</table>"}

/* ---------- Mass haul ---------- */
$("xmass").innerHTML=C("Material factors",`<div class="grid">${F("mS","Shrinkage, cut to compacted fill (%)",10)}${F("mW","Swell, bank to loose (%)",25)}${F("mF","Free haul distance (m)",100)}</div>
<div class="note">Ordinates use cut × (1 − shrinkage) minus fill, so every term is in compacted measure. Overhaul is the volume times the mean haul distance beyond free haul.</div>`)+
C("Balance",`<div class="res" id="mres"></div><div id="mchk" class="mt"></div>`)+C("Mass diagram",`<div id="mplot"></div><div class="note">Rising curve: material moves forward (to higher chainage). Falling: backward. Dots are balance points.</div>`)+
C("Balanced loops and overhaul",`<div class="sc" id="mtbl"></div>`);
function renderMass(d){
  const out=["mres","mchk","mplot","mtbl"];
  if(d.e){$("mres").innerHTML=msg("Fix the section data first.");["mchk","mplot","mtbl"].forEach(i=>$(i).innerHTML="");lastSec=null;return}
  const sh=(g("mS")||0)/100,sw=(g("mW")||0)/100,fh=g("mF")||0;
  if(sh<0||sh>=1||sw<0){$("mres").innerHTML=msg("Shrinkage between 0 and 99%, swell not negative.");["mchk","mplot","mtbl"].forEach(i=>$(i).innerHTML="");lastSec=null;return}
  let M=0;const pts=[{x:d.st[0].x,M:0}];
  d.sg.forEach((s,i)=>{const p=M;M+=s.vc*(1-sh)-s.vf;const x0=d.st[i].x,x1=d.st[i+1].x;if(p*M<0)pts.push({x:x0+(x1-x0)*p/(p-M),M:0});pts.push({x:x1,M})});
  const bp=[];pts.forEach((p,i)=>{if(Math.abs(p.M)<1e-9)bp.push(i)});
  const lp=[];for(let j=0;j<bp.length-1;j++){const sl=pts.slice(bp[j],bp[j+1]+1),V=Math.max(...sl.map(p=>Math.abs(p.M)));if(V<1e-9)continue;
    let a=0;for(let i=1;i<sl.length;i++)a+=(Math.abs(sl[i].M)+Math.abs(sl[i-1].M))/2*(sl[i].x-sl[i-1].x);const h=a/V;lp.push({x0:sl[0].x,x1:sl[sl.length-1].x,V,h,o:V*Math.max(0,h-fh),dir:sl.some(p=>p.M>0)?"Forward":"Backward"})}
  const bank=M>0?M/(1-sh):-M/(1-sh),loose=bank*(1+sw);
  lastSec={cut:d.tc,fill:d.tf,surplus:M>=0,bank,loose,borrow:-M};
  $("mres").innerHTML=cards([["Total cut (bank)",f(d.tc,1)+" m³"],["Usable cut (compacted)",f(d.tc*(1-sh),1)+" m³"],["Total fill",f(d.tf,1)+" m³"],
    [M>=0?"Surplus to spoil (bank)":"Borrow needed (bank)",f(bank,1)+" m³"],[M>=0?"Surplus loose volume":"Borrow compacted",f(M>=0?loose:-M,1)+" m³"],["Balance points",bp.length?bp.map(i=>f(pts[i].x,1)).join(", "):"none"]]);
  $("mchk").innerHTML=M>=0?`Net surplus: haul to spoil.`:`Net deficit: import borrow material.`;
  const W=360,H=230,pl=48,pr=10,pt=14,pb=26,x0=pts[0].x,x1=pts[pts.length-1].x,mn=Math.min(0,...pts.map(p=>p.M)),mx=Math.max(0,...pts.map(p=>p.M)),yr=(mx-mn)||1,
    X=x=>pl+(x-x0)/((x1-x0)||1)*(W-pl-pr),Y=v=>pt+(mx-v)/yr*(H-pt-pb);
  $("mplot").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img"><line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)"/><line x1="${pl}" x2="${pl}" y1="${pt}" y2="${H-pb}" stroke="var(--mut)"/>
  <path d="${pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+","+Y(p.M).toFixed(1)).join("")}" fill="none" stroke="var(--c1)" stroke-width="2"/>
  ${bp.map(i=>`<circle cx="${X(pts[i].x)}" cy="${Y(0)}" r="4" fill="var(--c2)"/>`).join("")}
  <text x="${pl-4}" y="${pt+8}" font-size="11" fill="var(--mut)" text-anchor="end">${f(mx,0)}</text><text x="${pl-4}" y="${H-pb}" font-size="11" fill="var(--mut)" text-anchor="end">${f(mn,0)}</text>
  <text x="${pl}" y="${H-8}" font-size="11" fill="var(--mut)">${f(x0,0)}</text><text x="${W-pr}" y="${H-8}" font-size="11" fill="var(--mut)" text-anchor="end">${f(x1,0)}</text>
  <text x="${W/2}" y="${H-8}" font-size="11" fill="var(--mut)" text-anchor="middle">Chainage (m), volume (m³)</text></svg>`;
  $("mtbl").innerHTML=lp.length?'<table><tr><th>From</th><th>To</th><th>Direction</th><th>Volume (m³)</th><th>Mean haul (m)</th><th>Overhaul (m³·m)</th></tr>'+
    lp.map(l=>`<tr><td>${f(l.x0,1)}</td><td>${f(l.x1,1)}</td><td>${l.dir}</td><td>${f(l.V,1)}</td><td>${f(l.h,1)}</td><td>${f(l.o,0)}</td></tr>`).join("")+`<tr class="tot"><td colspan="5">Total overhaul</td><td>${f(lp.reduce((s,l)=>s+l.o,0),0)}</td></tr></table>`:'<div class="note">No complete balanced loops. The whole length is one-directional, so use the surplus or borrow figure.</div>'}
function all(){const d=secData();renderSec(d);renderMass(d)}
function syncMode(){document.querySelectorAll(".lv").forEach(e=>e.hidden=$("xm").value!="lev");xRows()}
$("xsec").addEventListener("input",e=>{const i=e.target.dataset.i;if(i!==undefined)SXs[$("xm").value][i][e.target.dataset.k]=e.target.value;all()});
$("xsec").addEventListener("change",e=>{if(e.target.id=="xm")syncMode();all()});
$("xsec").addEventListener("click",e=>{const d=e.target.dataset.del,A=SXs[$("xm").value];
  if(d!==undefined&&A.length>2){A.splice(+d,1);xRows();all()}
  if(e.target.id=="xadd"){const l=A[A.length-1],p=A[A.length-2],x=parseFloat(l&&l.x),dx=l&&p?x-parseFloat(p.x):20;A.push({x:isFinite(x)&&isFinite(dx)?String(x+dx):"",a:"",b:""});xRows();all()}});
bind("xmass",all);

/* ---------- Trench quantities ---------- */
$("xtr").innerHTML=C("Pipe trench",`<div class="grid">${F("tL","Trench length (m)",120)}${F("tD","Pipe outside diameter (m)",0.6)}${F("tC","Working clearance each side (m)",0.3)}${F("tZ","Trench side slope (H : 1V, 0 = vertical)",0)}
${F("tC1","Cover over pipe at start (m)",1)}${F("tC2","Cover over pipe at end (m)",2.2)}${F("tB","Bedding below pipe (m)",0.15)}${F("tA","Surround above pipe (m)",0.15)}${F("tSh","Compaction shrinkage (%)",10)}${F("tSw","Swell, bank to loose (%)",25)}</div>
<div class="note">Depth varies linearly between the two ends and the excavation uses Simpson’s rule. Bedding and surround are assumed to be imported granular material.</div>`)+
C("Quantities",`<div class="res" id="tres"></div><div id="tchk" class="mt"></div>`);
function tr(){
  const L=g("tL"),OD=g("tD"),cl=g("tC"),z=g("tZ")||0,c1=g("tC1"),c2=g("tC2"),tb=g("tB"),ta=g("tA"),sh=(g("tSh")||0)/100,sw=(g("tSw")||0)/100;
  if(!(L>0)||!(OD>0)||!(cl>=0)||!(c1>=0)||!(c2>=0)||!(tb>=0)||!(ta>=0)||z<0||sh<0||sh>=1||sw<0){$("tres").innerHTML=msg("Length and diameter above 0, other values not negative, shrinkage below 100%.");$("tchk").innerHTML="";lastTr=null;return}
  const b=OD+2*cl,d1=c1+OD+tb,d2=c2+OD+tb,dm=(d1+d2)/2,Ar=d=>(b+z*d)*d,exc=L*(Ar(d1)+4*Ar(dm)+Ar(d2))/6,bed=b*tb*L,pipe=Math.PI*OD*OD/4*L,
    sur=(b*(OD+ta)-Math.PI*OD*OD/4)*L,back=exc-b*(tb+OD+ta)*L;
  if(back<0){$("tres").innerHTML=msg("The trench is shallower than bedding, pipe and surround combined.");$("tchk").innerHTML="";lastTr=null;return}
  const need=back/(1-sh),sp=exc-need,loose=Math.max(sp,0)*(1+sw),reinst=(b+z*(d1+d2))*L,mx=Math.max(d1,d2);
  lastTr={exc,imp:bed+sur,back,sp,loose,reinst};
  $("tres").innerHTML=cards([["Average depth",f(dm)+" m"],["Trench width at base",f(b)+" m"],["Excavation (bank)",f(exc,1)+" m³"],["Bedding",f(bed,1)+" m³"],["Surround (net of pipe)",f(sur,1)+" m³"],["Pipe volume",f(pipe,1)+" m³"],
    ["Backfill (compacted)",f(back,1)+" m³"],["Imported bedding + surround",f(bed+sur,1)+" m³"],[sp>=0?"Surplus spoil (bank)":"Extra fill to import (bank)",f(Math.abs(sp),1)+" m³"],[sp>=0?"Surplus loose volume":"Loose volume",f(sp>=0?loose:-sp*(1+sw),1)+" m³"],["Surface reinstatement",f(reinst,0)+" m²"],["Maximum depth",f(mx)+" m"]]);
  $("tchk").innerHTML=mx>1.2?`Depth exceeds 1.2 m: ${bd(false,"","PROVIDE TRENCH SUPPORT OR BATTER")} <span class="note">Check your local safety regulations.</span>`:`Depth within 1.2 m: ${bd(true,"UNSUPPORTED DEPTH LIMIT OK","")}`}
bind("xtr",tr);

/* ---------- Bill of quantities ---------- */
const BQ=[{d:"Clear and grub site",u:"m²",q:"",r:""},{d:"Bulk excavation",u:"m³",q:"",r:""},{d:"Compacted fill",u:"m³",q:"",r:""},{d:"Haul and dispose surplus",u:"m³",q:"",r:""}];
$("xbq").innerHTML=C("Bill of quantities",`<div class="row"><button id="bS">Add section quantities</button><button id="bT">Add trench quantities</button></div>
<div class="sc mt" id="brows"></div><button id="badd" class="mt">+ Add item</button>`)+
C("Totals",`<div class="grid">${F("bK","Contingency (%)",10)}${F("bV","Tax or VAT (%)",0)}<div><label>Currency label</label><input id="bCu" placeholder="e.g. KES"></div></div><div class="res mt" id="bres"></div><button id="bcp" class="mt">Copy as CSV</button>`);
function bRows(){$("brows").innerHTML='<table><tr><th>Description</th><th>Unit</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr>'+
  BQ.map((r,i)=>`<tr><td><input class="w" data-i="${i}" data-k="d" value="${r.d.replace(/"/g,"&quot;")}"></td><td><input class="u" data-i="${i}" data-k="u" value="${r.u}"></td><td><input data-i="${i}" data-k="q" value="${r.q}"></td><td><input data-i="${i}" data-k="r" value="${r.r}"></td><td id="am${i}"></td><td><button data-del="${i}" aria-label="Remove">×</button></td></tr>`).join("")+"</table>"}
function bq(){
  let sub=0;BQ.forEach((r,i)=>{const a=(parseFloat(r.q)||0)*(parseFloat(r.r)||0);sub+=a;const c=$("am"+i);if(c)c.textContent=n2(a)});
  const k=sub*(g("bK")||0)/100,tx=(sub+k)*(g("bV")||0)/100,cu=$("bCu").value.trim();
  $("bres").innerHTML=cards([["Subtotal",n2(sub)],["Contingency",n2(k)],["Tax or VAT",n2(tx)],["Grand total"+(cu?" ("+cu+")":""),n2(sub+k+tx)]]);
  return{sub,k,tx}}
$("xbq").addEventListener("input",e=>{const i=e.target.dataset.i;if(i!==undefined)BQ[i][e.target.dataset.k]=e.target.value;bq()});
$("xbq").addEventListener("click",e=>{const d=e.target.dataset.del,id=e.target.id;
  if(d!==undefined&&BQ.length>1){BQ.splice(+d,1);bRows();bq()}
  if(id=="badd"){BQ.push({d:"",u:"",q:"",r:""});bRows();bq()}
  if(id=="bS"&&lastSec){BQ.push({d:"Bulk excavation (cut, bank)",u:"m³",q:f(lastSec.cut),r:""},{d:"Compacted fill",u:"m³",q:f(lastSec.fill),r:""},
    lastSec.surplus?{d:"Haul and dispose surplus (loose)",u:"m³",q:f(lastSec.loose),r:""}:{d:"Import borrow fill (bank)",u:"m³",q:f(lastSec.bank),r:""});bRows();bq()}
  if(id=="bT"&&lastTr){BQ.push({d:"Trench excavation",u:"m³",q:f(lastTr.exc),r:""},{d:"Imported bedding and surround",u:"m³",q:f(lastTr.imp),r:""},{d:"Trench backfill (compacted)",u:"m³",q:f(lastTr.back),r:""},
    {d:"Surface reinstatement",u:"m²",q:f(lastTr.reinst,1),r:""});if(lastTr.sp>0)BQ.push({d:"Dispose surplus trench spoil (loose)",u:"m³",q:f(lastTr.loose),r:""});bRows();bq()}
  if(id=="bcp"){const t=bq(),q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    copy("Description,Unit,Qty,Rate,Amount\n"+BQ.map(r=>[q(r.d),q(r.u),r.q||0,r.r||0,((parseFloat(r.q)||0)*(parseFloat(r.r)||0)).toFixed(2)].join(",")).join("\n")+`\nSubtotal,,,,${t.sub.toFixed(2)}\nContingency,,,,${t.k.toFixed(2)}\nTax,,,,${t.tx.toFixed(2)}\nTotal,,,,${(t.sub+t.k+t.tx).toFixed(2)}`,e.target,"Copy as CSV")}});

$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===e.target));
  ["xsec","xmass","xtr","xbq"].forEach(s=>$(s).hidden=s!=t)};
syncMode();all();tr();bRows();bq();
</script>
